# Rendered from profiles/*/profile.toml.
# This template declares one active Hermes gateway container per owner instance.
# Runtime homes, token files, logs, backups, and mounts are outside git under EXO_RUNTIME_ROOT.
services:
  noah-personal-agent:
    image: "ghcr.io/0xtomdaniel/hermes-agent:stable"
    container_name: "exo-hermes-noah-personal-agent"
    restart: "unless-stopped"
    environment:
      HERMES_PROFILE_ID: "noah-personal-agent"
      HERMES_HOME: "${EXO_RUNTIME_ROOT}/noah-personal-agent/hermes-home"
      HERMES_WORKSPACE: "${EXO_RUNTIME_ROOT}/noah-personal-agent/workspace"
      TELEGRAM_BOT_TOKEN_FILE: "${EXO_RUNTIME_ROOT}/noah-personal-agent/secret-bridge/telegram-bot-token"
      TELEGRAM_OWNER_ID_SECRET: "NOAH_TELEGRAM_OWNER_ID"
      MODEL_API_KEY_SECRET: "NOAH_OPENAI_API_KEY"
      PHASE_APP: "exo-executive-agent"
      PHASE_ENVIRONMENT: "prod"
      PHASE_PATH: "/noah/personal-agent"
    volumes:
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/hermes-home:/opt/data/hermes-home"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/workspace:/workspace"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/secret-bridge/telegram-bot-token:/run/secrets/telegram-bot-token:ro"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/vault:/opt/data/vault"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/personal-files:/mnt/personal-files:ro"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/log-boundary:/var/log/hermes"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/backup-boundary:/opt/backups"
      - "${EXO_RUNTIME_ROOT}/noah-personal-agent/placeholders/personal-documents:/mnt/personal-documents:ro"

  sebastian-personal-agent:
    image: "ghcr.io/0xtomdaniel/hermes-agent:stable"
    container_name: "exo-hermes-sebastian-personal-agent"
    restart: "unless-stopped"
    environment:
      HERMES_PROFILE_ID: "sebastian-personal-agent"
      HERMES_HOME: "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/hermes-home"
      HERMES_WORKSPACE: "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/workspace"
      TELEGRAM_BOT_TOKEN_FILE: "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/secret-bridge/telegram-bot-token"
      TELEGRAM_OWNER_ID_SECRET: "SEBASTIAN_TELEGRAM_OWNER_ID"
      MODEL_API_KEY_SECRET: "SEBASTIAN_OPENAI_API_KEY"
      PHASE_APP: "exo-executive-agent"
      PHASE_ENVIRONMENT: "prod"
      PHASE_PATH: "/sebastian/personal-agent"
    volumes:
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/hermes-home:/opt/data/hermes-home"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/workspace:/workspace"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/secret-bridge/telegram-bot-token:/run/secrets/telegram-bot-token:ro"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/vault:/opt/data/vault"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/personal-files:/mnt/personal-files:ro"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/log-boundary:/var/log/hermes"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/backup-boundary:/opt/backups"
      - "${EXO_RUNTIME_ROOT}/sebastian-personal-agent/placeholders/personal-documents:/mnt/personal-documents:ro"

  tom-personal-agent:
    image: "ghcr.io/0xtomdaniel/hermes-agent:stable"
    container_name: "exo-hermes-tom-personal-agent"
    restart: "unless-stopped"
    environment:
      HERMES_PROFILE_ID: "tom-personal-agent"
      HERMES_HOME: "${EXO_RUNTIME_ROOT}/tom-personal-agent/hermes-home"
      HERMES_WORKSPACE: "${EXO_RUNTIME_ROOT}/tom-personal-agent/workspace"
      TELEGRAM_BOT_TOKEN_FILE: "${EXO_RUNTIME_ROOT}/tom-personal-agent/secret-bridge/telegram-bot-token"
      TELEGRAM_OWNER_ID_SECRET: "TOM_TELEGRAM_OWNER_ID"
      MODEL_API_KEY_SECRET: "TOM_OPENAI_API_KEY"
      PHASE_APP: "exo-executive-agent"
      PHASE_ENVIRONMENT: "prod"
      PHASE_PATH: "/tom/personal-agent"
    volumes:
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/hermes-home:/opt/data/hermes-home"
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/workspace:/workspace"
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/secret-bridge/telegram-bot-token:/run/secrets/telegram-bot-token:ro"
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/vault:/opt/data/vault"
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/personal-files:/mnt/personal-files:ro"
      - "${EXO_RUNTIME_ROOT}/tom-personal-agent/log-boundary:/var/log/hermes"

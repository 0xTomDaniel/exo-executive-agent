[profile]
id = "tom-local-dev"
owner_name = "Tom Daniel"
mode = "local-dev"
timezone = "Etc/UTC"

[hermes]
runtime = "hermes-agent"
home = "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
workspace = "${EXO_RUNTIME_ROOT}/tom-local-dev/workspace"
skills_dir = "/opt/data/skills"

[telegram]
mode = "fake"
owner_id_secret = "TELEGRAM_OWNER_ID"
bot_token_secret = "TELEGRAM_BOT_TOKEN"
owner_only = true
text_only = true

[model]
mode = "fake"
provider = "fake-local"
api_key_secret = "OPENAI_API_KEY"

[phase]
app = "exo-executive-agent"
environment = "dev"
path = "/tom/local"

[storage.runtime]
kind = "hermes-home"
path = "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
git_owned = false

[storage.vault]
kind = "markdown-vault"
path = "${EXO_RUNTIME_ROOT}/tom-local-dev/vault"
access = "read-write"
git_owned = false

[storage.personal_files]
kind = "personal-files"
path = "${EXO_RUNTIME_ROOT}/tom-local-dev/personal-files"
access = "read-only"
git_owned = false

[[tools.safe_core]]
name = "memory.read"
reason = "Read owner-approved Hermes memory/context."

[[tools.safe_core]]
name = "memory.write_markdown"
reason = "Write only to the agent-owned Markdown vault."

[[tools.safe_core]]
name = "files.read_workspace"
reason = "Read distribution workspace and local fixtures."

[[tools.safe_core]]
name = "telegram.reply_text"
reason = "Reply to owner-only text messages in the Telegram gateway."

[tools.external_actions]
enabled = false
allow = []
policy = "External-action tools require per-instance opt-in, Phase-managed secrets, and approval/audit documentation."

[smoke]
telegram_fixture = "profiles/tom-local-dev/fixtures/fake_telegram_owner_text.json"
phase_fixture = "profiles/tom-local-dev/fixtures/fake_phase_minimal.json"
storage_fixture_root = "profiles/tom-local-dev/fixtures/storage"
expected_reply = "Tom local/dev Exo is loaded with fake Telegram and safe-core tools only."

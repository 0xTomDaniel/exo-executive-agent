# Rendered from profiles/tom-local-dev/profile.toml.
# This template intentionally contains no secret values.
profile:
  id: "tom-local-dev"
  owner_name: "Tom Daniel"
  mode: "local-dev"
  timezone: "Etc/UTC"
soul: "../../../SOUL.md"
runtime:
  home: "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
  workspace: "${EXO_RUNTIME_ROOT}/tom-local-dev/workspace"
  skills_dir: "/opt/data/skills"
telegram:
  mode: "fake"
  owner_only: true
  text_only: true
  token_env: "TELEGRAM_BOT_TOKEN"
  owner_id_env: "TELEGRAM_OWNER_ID"
model:
  mode: "fake"
  provider: "fake-local"
  api_key_env: "OPENAI_API_KEY"
storage:
  runtime:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
  vault:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/vault"
    access: "read-write"
  personal_files:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/personal-files"
    access: "read-only"
tools:
  safe_core:
    - "memory.read"
    - "memory.write_markdown"
    - "files.read_workspace"
    - "telegram.reply_text"
  external_actions:
    enabled: false

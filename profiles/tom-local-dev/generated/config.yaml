# Rendered from profiles/tom-local-dev/profile.toml.
# This template intentionally contains no secret values.
profile:
  id: "tom-local-dev"
  owner_name: "Tom Daniel"
  mode: "local-dev"
  timezone: "Etc/UTC"
  role: "Local/dev validation profile for Tom Daniel using fake Telegram and fake model fixtures."
  intended_profile: "template-and-local-smoke"
soul: "../../../SOUL.md"
runtime:
  home: "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
  workspace: "${EXO_RUNTIME_ROOT}/tom-local-dev/workspace"
  skills_dir: "/opt/data/skills"
container:
  name: "exo-hermes-tom-local-dev"
  restart_policy: "unless-stopped"
telegram:
  mode: "fake"
  owner_only: true
  text_only: true
  token_env: "TELEGRAM_BOT_TOKEN"
  owner_id_env: "TELEGRAM_OWNER_ID"
  token_path: "${EXO_RUNTIME_ROOT}/tom-local-dev/secret-bridge/telegram-bot-token"
model:
  mode: "fake"
  provider: "fake-local"
  api_key_env: "OPENAI_API_KEY"
phase:
  app: "exo-executive-agent"
  environment: "dev"
  path: "/tom/local"
storage:
  runtime:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/hermes-home"
  vault:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/vault"
    access: "read-write"
  personal_files:
    path: "${EXO_RUNTIME_ROOT}/tom-local-dev/personal-files"
    access: "read-only"
  placeholder_mounts:
    - name: "calendar-export"
      path: "${EXO_RUNTIME_ROOT}/tom-local-dev/placeholders/calendar-export"
      mount_path: "/mnt/calendar-export"
      access: "read-only"
logs:
  path: "${EXO_RUNTIME_ROOT}/tom-local-dev/log-boundary"
backups:
  path: "${EXO_RUNTIME_ROOT}/tom-local-dev/backup-boundary"
  scope: "tom-local-dev-hermes-home-vault-and-config"
tools:
  safe_core:
    - "memory.read"
    - "memory.write_markdown"
    - "files.read_workspace"
    - "telegram.reply_text"
  external_actions:
    enabled: false
